# Hosted Copas keeper: `pnpm tick` every 5 minutes on Monad testnet.
# GitHub's cron never fired for this repo, so one run loops ticks for ~5h45m and then dispatches its successor
# (workflow_dispatch from GITHUB_TOKEN is allowed to start runs). The schedule stays as a backup starter.
# Each run reads all leaders/vaults, sends only state-changing txs (rollEpoch, checkpoint, touch, sync)
# through the Privy server wallet (policy-restricted, gas sponsored) and writes a job summary with explorer links.
name: keeper

on:
  schedule:
    - cron: '2-59/5 * * * *' # offset from :00/:05, GitHub's busiest minutes
  workflow_dispatch:
    inputs:
      ticks:
        description: ticks in this run (5 min apart)
        default: '69'

concurrency:
  group: keeper-tick
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # dispatch the next run

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: keeper
    env:
      CHAIN_ID: '10143'
      SIGNER_MODE: PRIVY
      PRIVY_SPONSOR: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: keeper/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # vault list + VaultCreated cursor, so each tick only scans the blocks since the last one
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: keeper/data
          key: keeper-state-10143-${{ github.run_id }}
          restore-keys: keeper-state-10143-
      - name: tick every 5 minutes
        run: |
          n=${{ inputs.ticks || '1' }}
          for i in $(seq 1 "$n"); do
            echo "### tick $i/$n $(date -u +%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
            pnpm tick || echo "::warning::tick $i failed"
            [ "$i" -lt "$n" ] && sleep 300
          done
        env: # secrets only reach the step that signs
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          PRIVY_AUTHORIZATION_KEY: ${{ secrets.PRIVY_AUTHORIZATION_KEY }}
          PRIVY_WALLET_ID: ${{ secrets.PRIVY_WALLET_ID }}
          # DOWN market maker (keeper/src/mm.ts): plain key holding MON + AUSD. Unset = the tick skips market making.
          MM_PRIVATE_KEY: ${{ secrets.MM_PRIVATE_KEY }}
          # optional: Telegram channel alerts (keeper/README.md). Unset = the tick skips alerts.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # read-only use: per-chat /watch lists the bot keeps in its private Vercel Blob store (web/lib/tgWatch.ts)
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always()
        with:
          path: keeper/data
          key: keeper-state-10143-${{ github.run_id }}-${{ github.run_attempt }}
      - name: start the next run
        if: success() && github.event_name == 'workflow_dispatch'
        run: gh workflow run keeper.yml --repo "$GITHUB_REPOSITORY" -f ticks=69
        env:
          GH_TOKEN: ${{ github.token }}
