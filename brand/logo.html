<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:1024px;background:#0d0f10}
.w{position:relative;width:1024px;height:1024px;display:grid;place-items:center;overflow:hidden}
.ring{position:absolute;width:760px;height:760px;border-radius:50%;border:10px solid #e3261b;box-sizing:border-box}
.ring2{position:absolute;width:700px;height:700px;border-radius:50%;border:3px dashed rgba(243,242,239,.35);box-sizing:border-box}
.c{font:900 560px/1 'Barlow Condensed',sans-serif;color:#f3f2ef;letter-spacing:-10px;transform:translate(-18px,-6px)}
.dot{position:absolute;width:132px;height:132px;border-radius:50%;background:#e3261b;left:610px;top:600px;box-shadow:0 0 0 18px #0d0f10}
</style></head><body><div class="w"><div class="ring"></div><div class="ring2"></div><div class="c">C</div><div class="dot"></div></div></body></html>
